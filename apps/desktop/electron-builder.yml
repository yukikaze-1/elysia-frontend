# apps/desktop/electron-builder.yml —— 阶段 1 最小未分发包（Forge 全量安装包留阶段 8）
appId: com.cyrene.desktop
productName: Cyrene
directories:
  output: dist
files:
  - out/**
  - package.json
asar: false
# 阶段 7 批次 A（spec §7.1/7.2）：fuse 三项关闭——打包产物不承担 node 子进程执行面 /
# NODE_OPTIONS 注入面收口（与 rejectForbiddenDebugSwitches 双保险）/ 防 --inspect 开调试端口。
# 配套读回断言在 scripts/verify-artifact.cjs（静态 read-back + --smoke flip-back 副本）。
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
linux:
  target: dir
  category: Utility
  # Linux 可执行名默认取 package name（@cyrene/desktop→@cyrenedesktop），不跟随 productName；
  # 显式固定为 productName，使 dist/linux-unpacked/Cyrene 与 verify-artifact 的候选名一致
  executableName: Cyrene
