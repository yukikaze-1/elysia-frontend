name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck + lint + unit + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Install Playwright (integration)
        run: pnpm --filter @cyrene/desktop exec playwright install --with-deps chromium

      - name: Integration tests (xvfb)
        run: xvfb-run -a pnpm test:integration

      - name: Unit tests
        run: pnpm test
