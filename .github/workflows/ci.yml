name: CI

on:
  push:
    branches: [main]
  pull_request:

# 独立 job 拆分：静态检查 / 单测 / 集成测试互不杂糅，失败各自定位、可并行。
# typecheck 与 lint 同属快速静态检查（无运行时依赖），合并为一个 job 省一次 install。
jobs:
  # 静态检查：typecheck + lint（纯 node，不需要 electron 二进制 / Playwright）
  check:
    name: typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Documentation structure
        run: pnpm docs:check

      # 敏感信息泄漏扫描（spec §5.1）：git ls-files 全量跟踪文件黑名单扫描 + 行级 allowlist——与 typecheck/lint 同 job（纯 node，无运行时依赖）
      - name: Sensitive info scan
        run: pnpm --filter @cyrene/desktop verify:sensitive

      # 跨仓契约门禁（P1-4 / M-40 / L-02，2026-09-11）。
      # 此前 check:contract **完全不在 CI 里**（唯一 workflow 0 命中），于是它既不会红也不会被看见——
      # 而本仓库吃过一次同类亏：该脚本曾以 exit 0 冒充"通过"，让"未核对"与"核对通过"在门禁语义上等价。
      # 现在**显式跑并显式标注**，退出码语义由 tests/unit/check-contract-gate.spec.ts 钉住：
      #   0 = 已核对且一致（notice）
      #   2 = 存在未核对段（GitHub warning 注解——CI 无后端仓库，常态如此；不是通过，但也不该把 job 变红，
      #       否则会训练出"忽略这个红"的习惯，那正是门禁失效的起点）
      #   其余（1 = 已核对且不一致 / 其他） = 红，必须有人处理
      - name: Cross-repo contract check (NOT VERIFIED is annotated, never silent)
        run: |
          set +e
          pnpm -F @cyrene/desktop check:contract
          code=$?
          set -e
          case "$code" in
            0) echo "::notice title=跨仓契约::已核对且与前端一致" ;;
            2) echo "::warning title=跨仓契约未核对::CI 无后端仓库，本次未做跨仓契约核对（NOT VERIFIED，**不是通过**）。在有后端的环境设 CYRENE_FRONTEND_CONTRACT_DIR 后本地执行 pnpm -F @cyrene/desktop check:contract。" ;;
            *) echo "::error title=跨仓契约不一致::check:contract 退出码 $code（1 = 已核对且不一致）"; exit "$code" ;;
          esac

  # 单元测试（node 环境，纯逻辑）
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

  # 集成测试：electron 二进制 + Playwright chromium + xvfb
  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # electron 43 无 postinstall，二进制靠 require('electron') 懒下载；
      # 缓存 @electron/get 的下载目录，miss 时 ensure 从网络下载并自动存回缓存，命中时秒复
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-cache-${{ runner.os }}-

      - name: Ensure Electron binary
        run: pnpm --filter @cyrene/desktop ensure:electron

      - name: Install Playwright (integration)
        run: pnpm --filter @cyrene/desktop exec playwright install --with-deps chromium

      - name: Integration tests (xvfb)
        run: xvfb-run -a pnpm test:integration

  # 打包态安全冒烟：clean → package（内含 electron-vite build）→ verify:artifact --smoke（P0-02 验收 A6 持续化）
  artifact:
    name: packaged artifact smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-cache-${{ runner.os }}-

      - name: Ensure Electron binary
        run: pnpm --filter @cyrene/desktop ensure:electron

      - name: Install Playwright (artifact smoke)
        run: pnpm --filter @cyrene/desktop exec playwright install --with-deps chromium

      - name: Clean + package (fresh out/dist)
        run: rm -rf out dist && pnpm --filter @cyrene/desktop package

      - name: Record app SHA
        run: git rev-parse HEAD > app-sha.txt

      - name: Upload SHA evidence
        uses: actions/upload-artifact@v4
        with:
          name: app-sha
          path: app-sha.txt

      - name: Artifact smoke (xvfb)
        run: xvfb-run -a pnpm --filter @cyrene/desktop verify:artifact -- --smoke

  # Windows 构建级门禁（C3：不启动 Electron）——unit 是 node 环境 + build 是打包器，均不需 electron 二进制
  windows:
    name: windows build-level
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck + lint + unit + build
        run: pnpm typecheck && pnpm lint && pnpm test && pnpm build

      # P2-4（2026-09-12）：主目标平台的**打包路径**此前从未在 CI 验证——windows job 只到 build 为止，
      # 而 `package`（electron-builder --dir + electronFuses 写 wire）与静态 `verify:artifact`
      # （读回 fuse wire、产物存在性、CSP、秘密正则）在 Windows 上一次都没跑过。
      # 这里补上；`verify:artifact` 不传 --smoke（Windows runner 属无头环境，启动冒烟由 Linux job 承担）。
      - name: Package (electron-builder --dir)
        run: pnpm --filter @cyrene/desktop package

      - name: Static artifact verification (fuse wire / CSP / secrets)
        run: pnpm --filter @cyrene/desktop verify:artifact

      - name: Record commit SHA (Windows evidence)
        run: git rev-parse HEAD > app-sha-win.txt

      - name: Upload SHA evidence
        uses: actions/upload-artifact@v4
        with:
          name: app-sha-win
          path: app-sha-win.txt
