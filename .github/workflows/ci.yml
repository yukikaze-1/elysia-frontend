name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一 ref 只保留最新一次运行（2026-09-12）。
# 依据（实测）：本仓为单人直推 main，run 历史里 34 天 143 次、**近 3 天 24 次/天**，其中大量是同一批改动的反复推送。
# 2026-09-12 起 job 全部迁到自建 runner（见下方迁移说明），计费分钟不再是约束，但**并发槽位**成了约束：
# X99 上只有 3 个实例，若旧 run 不取消，连推几次就会把新 run 的 job 排在旧 run 后面等实例——取消被顶掉的
# 旧 push 依然是「零风险、收益最直接」的一条。
# 代价（明确记录，不含糊）：同一分支连续推送时，**中间提交不会留下完整 CI 记录**——只有最后一次跑完。
# 因此：需要「每个提交都有门禁证据」时（doc 16 §3.1 的门禁记录纪律），把 cancel-in-progress 临时改 false 再推送。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 独立 job 拆分：静态检查 / 单测 / 集成测试互不杂糅，失败各自定位、可并行。
# typecheck 与 lint 同属快速静态检查（无运行时依赖），合并为一个 job 省一次 install。
#
# ============================ 2026-09-12：全部 Linux job 迁到自建 runner ============================
# 触发原因（**不是优化，是被迫**）：GitHub Actions 额度耗尽 / 账单被拒，托管 runner 上的 job 一律以
#   "The job was not started because recent account payments have failed or your spending limit needs
#    to be increased" 告终（实测 run `34688140376`：6 个托管 job 全部 0 秒失败，只有自建的两个跑起来）。
#   详见 docs/review/2026-09-12-Windows运行时取证与CI平台归属-决策记录.md §10。
# 承载方式：X99（Ubuntu，24 线程，24 小时开机）上同时跑**三个 runner 实例**，但**按 job 轻重分标签**
#   （见 §10.6 的实测依据）：
#     · `fe-linux`（实例 1、2）→ 只接**重型** job：integration 三分片 + integration-live2d
#     · `fe-light`（实例 3）  → 只接**轻型** job：check / unit / artifact
#   为什么不让三个实例都接重型 job：三个 Electron+SwiftShader 任务并发会把这台机器的渲染饿死——
#   实测（run `34692644842`）`message-list-follow-bottom ④` 因渲染跟不上滚动而红（中位数 2506px）。
#   拆开后重型侧最多 2 并发，与「2 实例跑 10.7 分钟重型活 + 1 实例跑 5.5 分钟轻型活」的工作量正好匹配。
#   单实例（不分标签）会把 7 个 Linux job 串行成 20 分钟以上，那是另一个极端。
# 迁移带来的三处机械改动（逐条都有理由，不是顺手改的）：
#   ① 去掉 `cache: pnpm`——服务用户 home 下的 pnpm store 跨 run 持久，走 Actions 缓存反而每 run 多传约 63MB；
#   ② 去掉 electron 的 `actions/cache`——同理，`~/.cache/electron` 已持久（120MB 不再往返）；
#   ③ `playwright install` 去掉 `--with-deps`——apt 需 root，系统库已在 runner 上一次性装好（16 个库已核）。
# 另外每个 self-hosted job 都要有 `timeout-minutes`：runner 掉线时 job 会一直排队（托管 runner 不会）。
# 回退方式：账单恢复后把各 job 的 `runs-on` 改回 `ubuntu-latest` 并恢复上面三处即可（差异都集中在这些行）。
jobs:
  # 静态检查：typecheck + lint（纯 node，不需要 electron 二进制 / Playwright）
  check:
    name: typecheck + lint
    runs-on: [self-hosted, Linux, X64, fe-light]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          # `dest` 必须按 runner 分开：它的默认值是 `~/setup-pnpm`，而三个 Linux 实例跑在**同一个用户**下，
          # 于是并发 job 的 pnpm 自安装器会互相踩——实测（run `34693129447` 的 `shard 1/3`）报
          #   `Something went wrong, self-installer exits with code 1`。
          # `runner.temp` 指向各 runner 自己的工作目录（`_work/_temp`），天然隔离。
          # 注意别把 **pnpm store** 也放进 `_work/_temp`：runner 每个 job 开始时会清空该目录
          # （日志里的 "Cleaning runner temp folder"），store 会每次重下——故 store 用
          # `--store-dir "$HOME/.pnpm-store-${{ runner.name }}"` 这种稳定且按实例分开的位置。
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # `--store-dir` 必须按 runner 分开：三个 Linux 实例**共用同一个 PNPM_HOME**，而 pnpm 11 的默认
      # store 是 `$PNPM_HOME/store/v11`——并发 install 会争抢同一个 store，实测让 job 直接红：
      #   `[Error: ENOTEMPTY: directory not empty, rmdir '/home/yomu/setup-pnpm/node_modules/.bin/store/v11/files/74']`
      # 环境变量改不动它（`npm_config_store_dir` / `NPM_CONFIG_STORE_DIR` / `PNPM_STORE_DIR` /
      # `XDG_DATA_HOME` 实测**全部被忽略**，PNPM_HOME 优先），只有 CLI `--store-dir` 有效（实测）。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$HOME/.pnpm-store-${{ runner.name }}"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Documentation structure
        run: pnpm docs:check

      # 敏感信息泄漏扫描（spec §5.1）：git ls-files 全量跟踪文件黑名单扫描 + 行级 allowlist——与 typecheck/lint 同 job（纯 node，无运行时依赖）
      - name: Sensitive info scan
        run: pnpm --filter @cyrene/desktop verify:sensitive

      # 跨仓契约门禁（P1-4 / M-40 / L-02，2026-09-11）。
      # 此前 check:contract **完全不在 CI 里**（唯一 workflow 0 命中），于是它既不会红也不会被看见——
      # 而本仓库吃过一次同类亏：该脚本曾以 exit 0 冒充"通过"，让"未核对"与"核对通过"在门禁语义上等价。
      # 现在**显式跑并显式标注**，退出码语义由 tests/unit/check-contract-gate.spec.ts 钉住：
      #   0 = 已核对且一致（notice）
      #   2 = 存在未核对段（GitHub warning 注解——CI 无后端仓库，常态如此；不是通过，但也不该把 job 变红，
      #       否则会训练出"忽略这个红"的习惯，那正是门禁失效的起点）
      #   其余（1 = 已核对且不一致 / 其他） = 红，必须有人处理
      - name: Cross-repo contract check (NOT VERIFIED is annotated, never silent)
        run: |
          set +e
          pnpm -F @cyrene/desktop check:contract
          code=$?
          set -e
          case "$code" in
            0) echo "::notice title=跨仓契约::已核对且与前端一致" ;;
            2) echo "::warning title=跨仓契约未核对::CI 无后端仓库，本次未做跨仓契约核对（NOT VERIFIED，**不是通过**）。在有后端的环境设 CYRENE_FRONTEND_CONTRACT_DIR 后本地执行 pnpm -F @cyrene/desktop check:contract。" ;;
            *) echo "::error title=跨仓契约不一致::check:contract 退出码 $code（1 = 已核对且不一致）"; exit "$code" ;;
          esac

  # 单元测试（node 环境，纯逻辑）
  unit:
    name: unit tests
    runs-on: [self-hosted, Linux, X64, fe-light]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          # `dest` 必须按 runner 分开：它的默认值是 `~/setup-pnpm`，而三个 Linux 实例跑在**同一个用户**下，
          # 于是并发 job 的 pnpm 自安装器会互相踩——实测（run `34693129447` 的 `shard 1/3`）报
          #   `Something went wrong, self-installer exits with code 1`。
          # `runner.temp` 指向各 runner 自己的工作目录（`_work/_temp`），天然隔离。
          # 注意别把 **pnpm store** 也放进 `_work/_temp`：runner 每个 job 开始时会清空该目录
          # （日志里的 "Cleaning runner temp folder"），store 会每次重下——故 store 用
          # `--store-dir "$HOME/.pnpm-store-${{ runner.name }}"` 这种稳定且按实例分开的位置。
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # `--store-dir` 必须按 runner 分开：三个 Linux 实例**共用同一个 PNPM_HOME**，而 pnpm 11 的默认
      # store 是 `$PNPM_HOME/store/v11`——并发 install 会争抢同一个 store，实测让 job 直接红：
      #   `[Error: ENOTEMPTY: directory not empty, rmdir '/home/yomu/setup-pnpm/node_modules/.bin/store/v11/files/74']`
      # 环境变量改不动它（`npm_config_store_dir` / `NPM_CONFIG_STORE_DIR` / `PNPM_STORE_DIR` /
      # `XDG_DATA_HOME` 实测**全部被忽略**，PNPM_HOME 优先），只有 CLI `--store-dir` 有效（实测）。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$HOME/.pnpm-store-${{ runner.name }}"

      - name: Unit tests
        run: pnpm test

  # 集成测试·分片 A：其余 36 个文件在自建 runner 上 3 分片（不含 electron-live2d*，2026-09-15 拆分后为三文件）
  #
  # 2026-09-12 分片批次（原为单 job 跑全套件：10.4 分钟 = 整个 CI 的墙钟）。分片依据是**实测逐文件计时**
  # （三处对照，见 docs/review/2026-09-12-Windows运行时取证与CI平台归属-决策记录.md §8.5）：
  #   electron-live2d：托管 278.8s ／ 自建 yomu-X99（24 线程）**182.3s** ／ 本机 i5 124.7s
  #   electron-voice ：托管  43.3s ／ 自建 **51.8s**（更慢）      electron-tools：31.2s ／ **38.3s**（更慢）
  #   ⇒ live2d 吃多线程软渲染，自建机明显更快；其余文件是单线程开销，托管机反而更快（单核强）。
  # 故分片按**文件特性**切而非均匀切：live2d 独占一个 job（见下），其余文件在这里 3 分片。
  # **机制提醒**：vitest 的 `--shard=N/M` 只按「路径 SHA-1 排序 + 文件数」均分，**不看耗时**——
  # 重文件必须单独成 job，否则含它的那一片会重新成为墙钟瓶颈。
  #
  # 分片数为什么取 3（本地复刻 vitest 的 shard 算法算过，逐片耗时见下表；**账号计费额度耗尽后这些分片
  # 也迁到自建 runner**，所以下面的墙钟现在由「3 个实例的调度」而非「托管并行度」决定）：
  #   分片数 | 各片测试耗时      | 单实例墙钟 | 托管并行墙钟
  #     1    | 290s             | 355s       | 5.9 分钟
  #     2    | 213 / 78s        | 278s       | 4.6 分钟
  #     3    | 158 / 106 / 26s  | 223s       | 4.1 分钟 ← 恰好触到 live2d job 形成的地板
  #     4-5  | ≤181s            | ≤181s      | 4.1 分钟（无收益：被 live2d job 卡住）
  #   再往下压必须**拆 electron-live2d.spec.ts**（它的 182s 独占一个 job 就是当前地板）——**2026-09-15 已拆**：
  #   该文件按**实测逐用例耗时**切成 electron-live2d-{core,motion,settings}.spec.ts 三个文件，在
  #   integration-live2d job 里**一个文件一个 job**（见该 job 注释）。本分片 job 的 `--exclude` 同步改为
  #   `**/electron-live2d*.spec.ts`——**只改文件名就会漏**：旧的精确名 `**/electron-live2d.spec.ts` 匹配不到
  #   拆分后的新文件名，三个新文件会被并进随机分片，既重复跑、又必然把某一片变成新瓶颈。
  integration:
    name: integration (shard ${{ matrix.shard }})
    runs-on: [self-hosted, Linux, X64, fe-linux]
    timeout-minutes: 45
    strategy:
      # 一片红不掩盖另一片的结果：所有片都要跑完才给结论
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          # `dest` 必须按 runner 分开：它的默认值是 `~/setup-pnpm`，而三个 Linux 实例跑在**同一个用户**下，
          # 于是并发 job 的 pnpm 自安装器会互相踩——实测（run `34693129447` 的 `shard 1/3`）报
          #   `Something went wrong, self-installer exits with code 1`。
          # `runner.temp` 指向各 runner 自己的工作目录（`_work/_temp`），天然隔离。
          # 注意别把 **pnpm store** 也放进 `_work/_temp`：runner 每个 job 开始时会清空该目录
          # （日志里的 "Cleaning runner temp folder"），store 会每次重下——故 store 用
          # `--store-dir "$HOME/.pnpm-store-${{ runner.name }}"` 这种稳定且按实例分开的位置。
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # `--store-dir` 必须按 runner 分开：三个 Linux 实例**共用同一个 PNPM_HOME**，而 pnpm 11 的默认
      # store 是 `$PNPM_HOME/store/v11`——并发 install 会争抢同一个 store，实测让 job 直接红：
      #   `[Error: ENOTEMPTY: directory not empty, rmdir '/home/yomu/setup-pnpm/node_modules/.bin/store/v11/files/74']`
      # 环境变量改不动它（`npm_config_store_dir` / `NPM_CONFIG_STORE_DIR` / `PNPM_STORE_DIR` /
      # `XDG_DATA_HOME` 实测**全部被忽略**，PNPM_HOME 优先），只有 CLI `--store-dir` 有效（实测）。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$HOME/.pnpm-store-${{ runner.name }}"

      - name: Ensure Electron binary
        run: pnpm --filter @cyrene/desktop ensure:electron

      # 不带 `--with-deps`：apt 需要 root，系统库已在 runner 上一次性装好（见文件头迁移说明）。
      # 也**不挂** `cache: pnpm` 与 electron 的 `actions/cache`：本地 profile 跨 run 持久，走缓存服务只是多传流量。
      - name: Install Playwright (integration)
        run: pnpm --filter @cyrene/desktop exec playwright install chromium

      - name: Build test artifacts (--mode test)
        run: pnpm --filter @cyrene/desktop exec electron-vite build --mode test

      # **参数必须直接交给 vitest**：`pnpm <script> -- <args>` **不会**把这些参数追加到脚本里的 vitest 上。
      # 2026-09-12 实测（这是本轮一次真实的假绿+超时事故）：那样写的结果是三个分片**各自跑完整套 27 个文件**
      #   —— 日志里 `Test Files 27 passed (27)`、每片 9～10 分钟，而预期是 1～3 分钟。
      #   同一实验里 `pnpm exec vitest run ... --shard=1/3` 直连则正确切分（unit 套件 239 → 80/80/79）。
      # 教训：分片/过滤这类「参数是否真的到位」不能靠想 —— 判据是日志里的 `Test Files N passed` 是否等于预期片内文件数。
      - name: Integration tests (xvfb, shard ${{ matrix.shard }})
        run: |
          xvfb-run -a pnpm --filter @cyrene/desktop exec vitest run \
            --config vitest.integration.config.mts \
            --exclude '**/electron-live2d*.spec.ts' \
            --shard=${{ matrix.shard }}

  # 集成测试·分片 2/2：electron-live2d 三文件（原单文件，2026-09-15 拆分）独占 self-hosted Linux job（matrix）
  #
  # 为什么这一族文件值得单独 job：原单文件是全套件最重的（28 用例 / 实测定标 182.3s），且对机器最敏感
  # （托管 278.8s vs 自建 182.3s）。放在自建 runner 上独享整机 24 线程，是当前性价比最高的一刀。
  #
  # **代价与前置（如实记录，不藏）**：
  #   · 该 job 依赖自建 runner 在线；服务器关机/掉线时它会排队到 timeout-minutes。要临时回退，
  #     把 runs-on 改回 ubuntu-latest 即可（墙钟回到 ~5.7 分钟，因为托管上该文件 278.8s）。
  #   · self-hosted 不挂 `cache: pnpm`（服务用户 home 下的 store 跨 run 持久，走 Actions 缓存反而每 run
  #     多传约 63MB），也不挂 electron 缓存（同理，profile 已持久）。
  #   · 这些文件只用 Electron、不使用 Playwright 浏览器二进制（`trust-boundary` 那类才需要），故不跑
  #     `playwright install`——三个 matrix job 的步骤里也没有这一步。
  integration-live2d:
    name: integration (live2d ${{ matrix.file }}, self-hosted)
    # 2026-09-15（A-1 拆分）：原 electron-live2d.spec.ts（28 用例、自建机实测定标 182.3s）**独占一个 job 就是
    # CI 墙钟地板**。按实测逐用例耗时拆成 3 个文件后，这里改成**一个文件一个 job**——单 job 墙钟从 182.3s
    # 降到该文件自己的耗时（本机实测 core 35.1s / motion 47.3s / settings 43.7s）。
    # fail-fast: false：一个文件红不掩盖另两个的结果（与 integration 分片 job 同款口径）。
    # 代价（如实记录，不藏）：3 个 job 各付一次 install + build 的固定开销，重型侧总工作量因此多出约 2 份
    # 固定开销；换来的是**关键路径不再被单个 182s 的 job 钉住**。若三文件出现明显长尾，下一刀按实测再平衡。
    # 判据（不靠想——分片 job 出过「参数没转发、三片各跑全量」的假绿事故）：每个 job 的日志必须是
    # `Test Files 1 passed (1)`；过滤器没到位时 vitest 以 "No test files found" 非零退出，不会静默变绿。
    strategy:
      fail-fast: false
      matrix:
        file:
          - electron-live2d-core.spec.ts
          - electron-live2d-motion.spec.ts
          - electron-live2d-settings.spec.ts
          # 2026-09-15（J 取证）：GPU 上下文丢失后的像素探针。它是**唯一**在触发 `WEBGL_lose_context`
          # 之后复查画布的用例（其余 Live2D 用例只断言 draw 调用数/首帧像素），故必须进 CI，
          # 否则「重建后状态就绪却空白」这类回归在自动化里无人看着。
          # 环境差异已用双支断言吸收：CI Linux（swrast）大概率与开发机一样落「回退」支
          # （那时断言"像素为 0"）；一旦哪台机器走到「就绪」支，则要求像素 > 0。
          - electron-live2d-context-loss.spec.ts
    runs-on: [self-hosted, Linux, X64, fe-linux]
    # self-hosted 掉线时 job 会一直排队（托管 runner 不会），必须有硬上限
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          # `dest` 必须按 runner 分开：它的默认值是 `~/setup-pnpm`，而三个 Linux 实例跑在**同一个用户**下，
          # 于是并发 job 的 pnpm 自安装器会互相踩——实测（run `34693129447` 的 `shard 1/3`）报
          #   `Something went wrong, self-installer exits with code 1`。
          # `runner.temp` 指向各 runner 自己的工作目录（`_work/_temp`），天然隔离。
          # 注意别把 **pnpm store** 也放进 `_work/_temp`：runner 每个 job 开始时会清空该目录
          # （日志里的 "Cleaning runner temp folder"），store 会每次重下——故 store 用
          # `--store-dir "$HOME/.pnpm-store-${{ runner.name }}"` 这种稳定且按实例分开的位置。
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # `--store-dir` 必须按 runner 分开：三个 Linux 实例**共用同一个 PNPM_HOME**，而 pnpm 11 的默认
      # store 是 `$PNPM_HOME/store/v11`——并发 install 会争抢同一个 store，实测让 job 直接红：
      #   `[Error: ENOTEMPTY: directory not empty, rmdir '/home/yomu/setup-pnpm/node_modules/.bin/store/v11/files/74']`
      # 环境变量改不动它（`npm_config_store_dir` / `NPM_CONFIG_STORE_DIR` / `PNPM_STORE_DIR` /
      # `XDG_DATA_HOME` 实测**全部被忽略**，PNPM_HOME 优先），只有 CLI `--store-dir` 有效（实测）。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$HOME/.pnpm-store-${{ runner.name }}"

      # 原来这两步由 `test:integration:live2d` 脚本内部完成；改成 matrix 后必须显式拆开——
      # 脚本里的位置参数是写死的 `electron-live2d`（且 `pnpm <script> -- <args>` 不转发参数，见分片 job 的事故记录），
      # 没法按 matrix 逐文件过滤，故这里直连 vitest 并把 `${{ matrix.file }}` 作为位置过滤器交给它。
      - name: Ensure Electron binary
        run: pnpm --filter @cyrene/desktop ensure:electron

      - name: Build test artifacts (--mode test)
        run: pnpm --filter @cyrene/desktop exec electron-vite build --mode test

      - name: Integration tests (live2d ${{ matrix.file }}, xvfb)
        run: |
          xvfb-run -a pnpm --filter @cyrene/desktop exec vitest run \
            --config vitest.integration.config.mts \
            ${{ matrix.file }}

  # 打包态安全冒烟：clean → package（内含 electron-vite build）→ verify:artifact --smoke（P0-02 验收 A6 持续化）
  artifact:
    name: packaged artifact smoke
    runs-on: [self-hosted, Linux, X64, fe-light]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          # `dest` 必须按 runner 分开：它的默认值是 `~/setup-pnpm`，而三个 Linux 实例跑在**同一个用户**下，
          # 于是并发 job 的 pnpm 自安装器会互相踩——实测（run `34693129447` 的 `shard 1/3`）报
          #   `Something went wrong, self-installer exits with code 1`。
          # `runner.temp` 指向各 runner 自己的工作目录（`_work/_temp`），天然隔离。
          # 注意别把 **pnpm store** 也放进 `_work/_temp`：runner 每个 job 开始时会清空该目录
          # （日志里的 "Cleaning runner temp folder"），store 会每次重下——故 store 用
          # `--store-dir "$HOME/.pnpm-store-${{ runner.name }}"` 这种稳定且按实例分开的位置。
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # `--store-dir` 必须按 runner 分开：三个 Linux 实例**共用同一个 PNPM_HOME**，而 pnpm 11 的默认
      # store 是 `$PNPM_HOME/store/v11`——并发 install 会争抢同一个 store，实测让 job 直接红：
      #   `[Error: ENOTEMPTY: directory not empty, rmdir '/home/yomu/setup-pnpm/node_modules/.bin/store/v11/files/74']`
      # 环境变量改不动它（`npm_config_store_dir` / `NPM_CONFIG_STORE_DIR` / `PNPM_STORE_DIR` /
      # `XDG_DATA_HOME` 实测**全部被忽略**，PNPM_HOME 优先），只有 CLI `--store-dir` 有效（实测）。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$HOME/.pnpm-store-${{ runner.name }}"

      - name: Ensure Electron binary
        run: pnpm --filter @cyrene/desktop ensure:electron

      # 不带 `--with-deps`（apt 需 root；系统库已装好）；`--smoke` 需要 xvfb，runner 上已装
      - name: Install Playwright (artifact smoke)
        run: pnpm --filter @cyrene/desktop exec playwright install chromium

      - name: Clean + package (fresh out/dist)
        run: rm -rf out dist && pnpm --filter @cyrene/desktop package

      - name: Record app SHA
        run: git rev-parse HEAD > app-sha.txt

      - name: Upload SHA evidence
        uses: actions/upload-artifact@v4
        with:
          name: app-sha
          path: app-sha.txt

      - name: Artifact smoke (xvfb)
        run: xvfb-run -a pnpm --filter @cyrene/desktop verify:artifact -- --smoke

  # Windows 构建级门禁（C3：不启动 Electron）——**注意：unit 套件确实需要 electron 二进制**
  #
  # 2026-09-13 实测更正：本行原先写的是「unit 是 node 环境 + build 是打包器，均**不需** electron 二进制」。
  # 那是**假设而非事实**。用「unit spec 的相对 import 闭包」扫描实测：**252 个 unit spec 里有 50 个会到达
  # `from 'electron'`**（经 `native-ui/dialog-service.ts` 32、`ipc/registry.ts` 8、`credentials/safe-storage.ts` 2、
  # 以及 `persistence-handlers.ts`/`protocol/*`/`windows/main-window.ts` 等），而 `electron@43` 无 postinstall
  # ⇒ 二进制靠 `require('electron')` 懒下载。干净工作区里多个 vitest worker **同时**首次 require ⇒ 并发解包
  # ⇒ `os error 183`（`dist\resources` 已存在）⇒ **某个 spec 文件加载失败（0 test）**的偶发红
  # （run `34757913922` 的 windows job：`settings-service.spec.ts (0 test)`）。故 `pnpm test` 已改为先
  # `ensure:electron` 再跑 vitest（与 integration 脚本同款），把解包串行化到 vitest 启动之前。
  #
  # 2026-09-12：从 GitHub 托管 `windows-latest` 改钉到本仓 self-hosted runner（`yomu-win11`，标签 `fe-win`）。
  # 依据（本机实测，非推断）：
  #   ① 计费：私有仓库托管 Windows runner 按 **2× 计费**，本 job 约占 12.4 计费分钟/run；self-hosted 不计费。
  #   ② 形态匹配：本 job 全程**不启动 Electron GUI**（typecheck / lint / unit / build / electron-builder --dir /
  #      静态 verify:artifact 都是 node），因此 runner 的服务形态（服务账号 NT AUTHORITY\NETWORK SERVICE、
  #      **Session 0 无桌面无 GPU**）不影响它——GUI 运行时验证另见 windows-runtime.yml。
  #   ③ 工作目录：runner 装在 `G:\actions-runner`，`_work` 不在开发检出目录内，
  #      故 `actions/checkout` 默认的 `git clean -ffdx` 不会波及开发者的未跟踪文件。
  # 已知代价（首次运行的冷启动，如实记录）：
  #   - 服务账号有自己的 profile（`C:\Windows\ServiceProfiles\NetworkService`），**看不到** `C:\Users\<user>`
  #     下的 electron dist / pnpm store / ms-playwright。故首次运行需冷下载（Electron 二进制约 120MB 等）。
  #   - 该 profile 落在工作区之外、跨 run 持久，所以**不要**给本 job 加 `actions/cache` 的 electron 缓存：
  #     本地已持久，走 GitHub 缓存服务反而每次多传 120MB（integration/artifact 两个托管 job 的缓存保持原样）。
  # timeout-minutes：self-hosted 掉线时 job 会一直排队（托管 runner 不会），必须有硬上限。
  windows:
    name: windows build-level
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          # `dest` 必须按 runner 分开：它的默认值是 `~/setup-pnpm`，而三个 Linux 实例跑在**同一个用户**下，
          # 于是并发 job 的 pnpm 自安装器会互相踩——实测（run `34693129447` 的 `shard 1/3`）报
          #   `Something went wrong, self-installer exits with code 1`。
          # `runner.temp` 指向各 runner 自己的工作目录（`_work/_temp`），天然隔离。
          # 注意别把 **pnpm store** 也放进 `_work/_temp`：runner 每个 job 开始时会清空该目录
          # （日志里的 "Cleaning runner temp folder"），store 会每次重下——故 store 用
          # `--store-dir "$HOME/.pnpm-store-${{ runner.name }}"` 这种稳定且按实例分开的位置。
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # `--store-dir` 必须按 runner 分开：三个 Linux 实例**共用同一个 PNPM_HOME**，而 pnpm 11 的默认
      # store 是 `$PNPM_HOME/store/v11`——并发 install 会争抢同一个 store，实测让 job 直接红：
      #   `[Error: ENOTEMPTY: directory not empty, rmdir '/home/yomu/setup-pnpm/node_modules/.bin/store/v11/files/74']`
      # 环境变量改不动它（`npm_config_store_dir` / `NPM_CONFIG_STORE_DIR` / `PNPM_STORE_DIR` /
      # `XDG_DATA_HOME` 实测**全部被忽略**，PNPM_HOME 优先），只有 CLI `--store-dir` 有效（实测）。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$HOME/.pnpm-store-${{ runner.name }}"

      # 2026-09-12：原为一条 `pnpm typecheck && pnpm lint && pnpm test && pnpm build`。托管 windows-latest
      # 预装 PowerShell 7，`&&` 可用；而本仓的 self-hosted 机器**没有装 pwsh 7**（实测
      # `C:\Program Files\PowerShell\7\pwsh.exe` 不存在），GitHub 遂回退到 Windows PowerShell 5.1——
      # `&&` 在该版本是**语法错误**（实测 `The token '&&' is not a valid statement separator in this version`），
      # 整条 job 在第一步就红，且与 git/代理无关（那是上一轮的问题，已修）。
      # 改为**四个独立 step**：不依赖任何 pwsh 特性、天然 fail-fast，且失败定位比 `&&` 链更准。
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # P2-4（2026-09-12）：主目标平台的**打包路径**此前从未在 CI 验证——windows job 只到 build 为止，
      # 而 `package`（electron-builder --dir + electronFuses 写 wire）与静态 `verify:artifact`
      # （读回 fuse wire、产物存在性、CSP、秘密正则）在 Windows 上一次都没跑过。
      # 这里补上；`verify:artifact` 不传 --smoke（Windows runner 属无头环境，启动冒烟由 Linux job 承担）。
      - name: Package (electron-builder --dir)
        run: pnpm --filter @cyrene/desktop package

      - name: Static artifact verification (fuse wire / CSP / secrets)
        run: pnpm --filter @cyrene/desktop verify:artifact

      - name: Record commit SHA (Windows evidence)
        run: git rev-parse HEAD > app-sha-win.txt

      - name: Upload SHA evidence
        uses: actions/upload-artifact@v4
        with:
          name: app-sha-win
          path: app-sha-win.txt
