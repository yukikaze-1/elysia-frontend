name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck + lint + unit + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # electron 43 无 postinstall，二进制改为 require('electron') 时懒下载；集成测试 helper 硬编码
      # dist 路径（不走 require），全新环境必须在此显式触发 install.js，否则 electron.launch ENOENT
      - name: Ensure Electron binary
        run: pnpm --filter @cyrene/desktop ensure:electron

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Install Playwright (integration)
        run: pnpm --filter @cyrene/desktop exec playwright install --with-deps chromium

      - name: Integration tests (xvfb)
        run: xvfb-run -a pnpm test:integration

      - name: Unit tests
        run: pnpm test
