:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;

        &lt;button class=&quot;cy-search-result&quot; type=&quot;button&quot; data-search-text=&quot;图片 构图 标注 Cyrene&quot;&gt;&lt;small class=&quot;cy-muted&quot;&gt;今天 17:24 · Cyrene&lt;/small&gt;&lt;br&gt;已生成&lt;mark&gt;构图标注&lt;/mark&gt;，并附带动效和语音回复。&lt;/button&gt;
        &lt;button class=&quot;cy-search-result&quot; type=&quot;button&quot; data-search-text=&quot;README 项目 前端 顺序&quot;&gt;&lt;small class=&quot;cy-muted&quot;&gt;昨天 21:08 · 你&lt;/small&gt;&lt;br&gt;先看看 &lt;mark&gt;README&lt;/mark&gt;，再帮我整理前端开发顺序。&lt;/button&gt;

    &lt;div class=&quot;cy-modal-layer&quot; id=&quot;cy-permission-modal&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;cy-permission-title&quot;&gt;
      &lt;div class=&quot;cy-modal&quot;&gt;
        &lt;h3 id=&quot;cy-permission-title&quot;&gt;允许读取本地文件？&lt;/h3&gt;
        &lt;p class=&quot;cy-muted&quot;&gt;Cyrene 需要读取一个文本文件，以便生成前端实施计划。&lt;/p&gt;
        &lt;div class=&quot;cy-permission-summary&quot;&gt;
          &lt;div class=&quot;cy-permission-row&quot;&gt;
            &lt;span class=&quot;cy-muted&quot;&gt;执行位置&lt;/span&gt;
            &lt;strong&gt;此电脑&lt;/strong&gt;
          &lt;/div&gt;
          &lt;div class=&quot;cy-permission-row&quot;&gt;
            &lt;span class=&quot;cy-muted&quot;&gt;目标&lt;/span&gt;
            &lt;span&gt;project/README.md&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;cy-permission-row&quot;&gt;
            &lt;span class=&quot;cy-muted&quot;&gt;将发送&lt;/span&gt;
            &lt;span&gt;文件文本内容，最大 2 MB&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;cy-permission-row&quot;&gt;
            &lt;span class=&quot;cy-muted&quot;&gt;有效范围&lt;/span&gt;
            &lt;span&gt;仅本次操作&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;cy-modal-actions&quot;&gt;
          &lt;button class=&quot;cy-action-button cy-danger&quot; id=&quot;cy-deny-permission&quot; type=&quot;button&quot;&gt;拒绝&lt;/button&gt;
          &lt;button class=&quot;cy-action-button cy-primary&quot; id=&quot;cy-allow-permission&quot; type=&quot;button&quot;&gt;允许一次&lt;/button&gt;

    &lt;div class=&quot;cy-modal-layer&quot; id=&quot;cy-custom-model-modal&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;cy-custom-model-title&quot;&gt;
      &lt;div class=&quot;cy-modal&quot;&gt;
        &lt;h3 id=&quot;cy-custom-model-title&quot;&gt;添加自定义模型&lt;/h3&gt;
        &lt;p class=&quot;cy-muted&quot;&gt;创建 LLM、STT、TTS 或输入法转写 Profile；保存前可先测试连接。&lt;/p&gt;
        &lt;div class=&quot;cy-custom-model-form&quot;&gt;
          &lt;label class=&quot;cy-field&quot;&gt;&lt;small&gt;模型类型&lt;/small&gt;&lt;select id=&quot;cy-custom-model-type&quot;&gt;&lt;option value=&quot;llm&quot;&gt;LLM&lt;/option&gt;&lt;option value=&quot;stt&quot;&gt;STT&lt;/option&gt;&lt;option value=&quot;tts&quot;&gt;TTS&lt;/option&gt;&lt;option value=&quot;dictation&quot;&gt;输入法转写&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
          &lt;label class=&quot;cy-field&quot;&gt;&lt;small&gt;兼容协议&lt;/small&gt;&lt;select id=&quot;cy-custom-model-protocol&quot;&gt;&lt;option&gt;OpenAI Compatible&lt;/option&gt;&lt;option&gt;Custom REST&lt;/option&gt;&lt;option&gt;Local Worker&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
          &lt;label class=&quot;cy-field cy-full-field&quot;&gt;&lt;small&gt;显示名称&lt;/small&gt;&lt;input id=&quot;cy-custom-model-name&quot; type=&quot;text&quot; placeholder=&quot;例如：本地 Qwen 32B&quot;&gt;&lt;/label&gt;
          &lt;label class=&quot;cy-field&quot;&gt;&lt;small&gt;模型 ID&lt;/small&gt;&lt;input id=&quot;cy-custom-model-id&quot; type=&quot;text&quot; placeholder=&quot;qwen3-32b&quot;&gt;&lt;/label&gt;
          &lt;label class=&quot;cy-field&quot;&gt;&lt;small&gt;服务地址&lt;/small&gt;&lt;input id=&quot;cy-custom-model-endpoint&quot; type=&quot;url&quot; placeholder=&quot;https://api.example.com/v1&quot;&gt;&lt;/label&gt;
          &lt;label class=&quot;cy-field cy-full-field&quot;&gt;&lt;small&gt;API Key（可选）&lt;/small&gt;&lt;input id=&quot;cy-custom-model-key&quot; type=&quot;password&quot; placeholder=&quot;仅交给主进程安全保存&quot;&gt;&lt;/label&gt;
        &lt;/div&gt;
        &lt;small class=&quot;cy-muted&quot; id=&quot;cy-custom-model-status&quot;&gt;尚未测试&lt;/small&gt;
        &lt;div class=&quot;cy-modal-actions&quot;&gt;
          &lt;button class=&quot;cy-action-button&quot; id=&quot;cy-close-custom-model&quot; type=&quot;button&quot;&gt;取消&lt;/button&gt;
          &lt;button class=&quot;cy-action-button&quot; id=&quot;cy-test-custom-model&quot; type=&quot;button&quot;&gt;测试连接&lt;/button&gt;
          &lt;button class=&quot;cy-action-button cy-primary&quot; id=&quot;cy-save-custom-model&quot; type=&quot;button&quot;&gt;保存并切换&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;cyrene-ui-prototype&#x27;);
      if (!root) return;

      const views = Array.from(root.querySelectorAll(&#x27;[data-view]&#x27;));
      const navButtons = Array.from(root.querySelectorAll(&#x27;[data-nav]&#x27;));
      const conversationButtons = Array.from(root.querySelectorAll(&#x27;[data-conversation]&#x27;));
      const liveButtons = Array.from(root.querySelectorAll(&#x27;[data-live-toggle]&#x27;));
      const liveSetting = root.querySelector(&#x27;#cy-live-setting&#x27;);
      const modal = root.querySelector(&#x27;#cy-permission-modal&#x27;);
      const reviewButton = root.querySelector(&#x27;#cy-review-permission&#x27;);
      const allowButton = root.querySelector(&#x27;#cy-allow-permission&#x27;);
      const denyButton = root.querySelector(&#x27;#cy-deny-permission&#x27;);
      const toolStatus = root.querySelector(&#x27;#cy-tool-status&#x27;);
      const toolDetails = root.querySelector(&#x27;#cy-tool-details&#x27;);
      const liveStatus = root.querySelector(&#x27;#cy-live-status&#x27;);
      const chatTitle = root.querySelector(&#x27;#cy-chat-title&#x27;);
      const input = root.querySelector(&#x27;#cy-message-input&#x27;);
      const sendButton = root.querySelector(&#x27;#cy-send-message&#x27;);
      const messageThread = root.querySelector(&#x27;#cy-message-thread&#x27;);
      const settingsButtons = Array.from(root.querySelectorAll(&#x27;[data-settings-tab]&#x27;));
      const settingsPanels = Array.from(root.querySelectorAll(&#x27;[data-settings-panel]&#x27;));
      const serviceTestButtons = Array.from(root.querySelectorAll(&#x27;[data-test-service]&#x27;));
      const prototypeActionButtons = Array.from(root.querySelectorAll(&#x27;[data-prototype-action]&#x27;));
      const fontRange = root.querySelector(&#x27;#cy-font-range&#x27;);
      const fontValue = root.querySelector(&#x27;#cy-font-value&#x27;);
      const accentColor = root.querySelector(&#x27;#cy-accent-color&#x27;);
      const liveModel = root.querySelector(&#x27;#cy-live-model&#x27;);
      const liveName = root.querySelector(&#x27;#cy-live-name&#x27;);
      const micButton = root.querySelector(&#x27;#cy-mic-button&#x27;);
      const voiceInputSetting = root.querySelector(&#x27;#cy-voice-input-setting&#x27;);
      const realtimeVoiceSetting = root.querySelector(&#x27;#cy-realtime-voice-setting&#x27;);
      const prototypeStatus = root.querySelector(&#x27;#cy-prototype-status&#x27;);
      const conversationSearch = root.querySelector(&#x27;#cy-conversation-search&#x27;);
      const resourceDrawer = root.querySelector(&#x27;#cy-resource-drawer&#x27;);
      const messageSearchDrawer = root.querySelector(&#x27;#cy-message-search-drawer&#x27;);
      const openResources = root.querySelector(&#x27;#cy-open-resources&#x27;);
      const closeResources = root.querySelector(&#x27;#cy-close-resources&#x27;);
      const openMessageSearch = root.querySelector(&#x27;#cy-open-message-search&#x27;);
      const closeMessageSearch = root.querySelector(&#x27;#cy-close-message-search&#x27;);
      const resourceFilters = Array.from(root.querySelectorAll(&#x27;[data-resource-filter]&#x27;));
      const resourceCards = Array.from(root.querySelectorAll(&#x27;[data-resource-type]&#x27;));
      const messageSearchInput = root.querySelector(&#x27;#cy-message-search-input&#x27;);
      const messageSearchResults = Array.from(root.querySelectorAll(&#x27;[data-search-text]&#x27;));
      const loadHistoryButton = root.querySelector(&#x27;#cy-load-history&#x27;);
      const earlierMessage = root.querySelector(&#x27;#cy-earlier-message&#x27;);
      const chatView = root.querySelector(&#x27;[data-view=&quot;chat&quot;]&#x27;);
      const fileInput = root.querySelector(&#x27;#cy-file-input&#x27;);
      const addFileButton = root.querySelector(&#x27;#cy-add-file&#x27;);
      const attachmentChips = root.querySelector(&#x27;#cy-attachment-chips&#x27;);
      const customModelModal = root.querySelector(&#x27;#cy-custom-model-modal&#x27;);
      const openCustomModel = root.querySelector(&#x27;#cy-open-custom-model&#x27;);
      const closeCustomModel = root.querySelector(&#x27;#cy-close-custom-model&#x27;);
      const testCustomModel = root.querySelector(&#x27;#cy-test-custom-model&#x27;);
      const saveCustomModel = root.querySelector(&#x27;#cy-save-custom-model&#x27;);
      const customModelType = root.querySelector(&#x27;#cy-custom-model-type&#x27;);
      const customModelName = root.querySelector(&#x27;#cy-custom-model-name&#x27;);
      const customModelId = root.querySelector(&#x27;#cy-custom-model-id&#x27;);
      const customModelEndpoint = root.querySelector(&#x27;#cy-custom-model-endpoint&#x27;);
      const customModelKey = root.querySelector(&#x27;#cy-custom-model-key&#x27;);
      const customModelStatus = root.querySelector(&#x27;#cy-custom-model-status&#x27;);
      const customModelList = root.querySelector(&#x27;#cy-custom-model-list&#x27;);
      const llmModelSelect = root.querySelector(&#x27;#cy-llm-model-select&#x27;);
      const sttModelSelect = root.querySelector(&#x27;#cy-stt-model-select&#x27;);
      const ttsModelSelect = root.querySelector(&#x27;#cy-tts-model-select&#x27;);
      const dictationModelSelect = root.querySelector(&#x27;#cy-dictation-model-select&#x27;);
      const historyViewer = root.querySelector(&#x27;#cy-history-viewer&#x27;);
      const closeHistory = root.querySelector(&#x27;#cy-close-history&#x27;);
      const historyTabs = Array.from(root.querySelectorAll(&#x27;[data-history-tab]&#x27;));
      const historyPanels = Array.from(root.querySelectorAll(&#x27;[data-history-panel]&#x27;));
      const historySearch = root.querySelector(&#x27;#cy-history-search&#x27;);
      const historyDate = root.querySelector(&#x27;#cy-history-date&#x27;);
      const historyDateLabel = root.querySelector(&#x27;#cy-history-date-label&#x27;);
      const historyItems = Array.from(root.querySelectorAll(&#x27;[data-history-text]&#x27;));
      const openStickers = root.querySelector(&#x27;#cy-open-stickers&#x27;);
      const stickerPanel = root.querySelector(&#x27;#cy-sticker-panel&#x27;);
      const stickerTabs = Array.from(root.querySelectorAll(&#x27;[data-sticker-tab]&#x27;));
      const stickerPanels = Array.from(root.querySelectorAll(&#x27;[data-sticker-panel]&#x27;));
      const emojiChoices = Array.from(root.querySelectorAll(&#x27;[data-emoji]&#x27;));
      const stickerChoices = Array.from(root.querySelectorAll(&#x27;[data-sticker-name]&#x27;));
      const holdDictation = root.querySelector(&#x27;#cy-hold-dictation&#x27;);
      const dictationSetting = root.querySelector(&#x27;#cy-dictation-setting&#x27;);

      const setView = (name) =&gt; {
        root.dataset.activeView = name;
        views.forEach((view) =&gt; view.classList.toggle(&#x27;is-active&#x27;, view.dataset.view === name));
        navButtons.forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.nav === name)));
      };

      const setLiveVisible = (visible) =&gt; {
        root.classList.toggle(&#x27;cy-live-hidden&#x27;, !visible);
        liveButtons.forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(visible)));
        if (liveSetting) liveSetting.checked = visible;
      };

      const closeDrawers = () =&gt; {
        if (resourceDrawer) resourceDrawer.classList.remove(&#x27;is-open&#x27;);
        if (messageSearchDrawer) messageSearchDrawer.classList.remove(&#x27;is-open&#x27;);
        if (historyViewer) historyViewer.classList.remove(&#x27;is-open&#x27;);
      };

      navButtons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; setView(button.dataset.nav)));

      window.requestAnimationFrame(() =&gt; {
        window.requestAnimationFrame(() =&gt; setLiveVisible(true));
      });

      if (conversationSearch) {
        conversationSearch.addEventListener(&#x27;input&#x27;, () =&gt; {
          const query = conversationSearch.value.trim().toLocaleLowerCase();
          conversationButtons.forEach((button) =&gt; {
            const haystack = (button.dataset.search || button.textContent || &#x27;&#x27;).toLocaleLowerCase();
            button.hidden = Boolean(query) &amp;&amp; !haystack.includes(query);
          });
        });
      }

      const setHistoryTab = (name) =&gt; {
        historyTabs.forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.historyTab === name)));
        historyPanels.forEach((panel) =&gt; panel.classList.toggle(&#x27;is-active&#x27;, panel.dataset.historyPanel === name));
      };

      const openHistoryViewer = (tab) =&gt; {
        closeDrawers();
        if (!historyViewer) return;
        setHistoryTab(tab);
        historyViewer.classList.add(&#x27;is-open&#x27;);
        if (tab === &#x27;all&#x27; &amp;&amp; historySearch) historySearch.focus();
        else if (closeHistory) closeHistory.focus();
      };

      if (openResources &amp;&amp; historyViewer) {
        openResources.addEventListener(&#x27;click&#x27;, () =&gt; {
          openHistoryViewer(&#x27;media&#x27;);
        });
      }

      if (closeResources) closeResources.addEventListener(&#x27;click&#x27;, closeDrawers);

      if (openMessageSearch &amp;&amp; historyViewer) {
        openMessageSearch.addEventListener(&#x27;click&#x27;, () =&gt; {
          openHistoryViewer(&#x27;all&#x27;);
        });
      }

      if (closeMessageSearch) closeMessageSearch.addEventListener(&#x27;click&#x27;, closeDrawers);
      if (closeHistory) closeHistory.addEventListener(&#x27;click&#x27;, closeDrawers);

      historyTabs.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; setHistoryTab(button.dataset.historyTab || &#x27;all&#x27;)));

      const applyHistoryFilter = () =&gt; {
        const query = historySearch ? historySearch.value.trim().toLocaleLowerCase() : &#x27;&#x27;;
        const selectedDate = historyDate ? historyDate.value : &#x27;&#x27;;
        if (historyDateLabel) historyDateLabel.textContent = selectedDate ? selectedDate.replaceAll(&#x27;-&#x27;, &#x27;/&#x27;) : &#x27;全部日期&#x27;;
        historyItems.forEach((item) =&gt; {
          const haystack = (item.dataset.historyText || item.textContent || &#x27;&#x27;).toLocaleLowerCase();
          const itemDate = item.dataset.historyDate || &#x27;&#x27;;
          const dateMatches = !selectedDate || !itemDate || itemDate === selectedDate;
          item.hidden = !dateMatches || (Boolean(query) &amp;&amp; !haystack.includes(query));
        });
      };

      if (historySearch) historySearch.addEventListener(&#x27;input&#x27;, applyHistoryFilter);
      if (historyDate) historyDate.addEventListener(&#x27;change&#x27;, applyHistoryFilter);

      resourceFilters.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const selected = button.dataset.resourceFilter || &#x27;all&#x27;;
          resourceFilters.forEach((item) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button)));
          resourceCards.forEach((card) =&gt; {
            card.hidden = selected !== &#x27;all&#x27; &amp;&amp; card.dataset.resourceType !== selected;
          });
        });
      });

      if (messageSearchInput) {
        messageSearchInput.addEventListener(&#x27;input&#x27;, () =&gt; {
          const query = messageSearchInput.value.trim().toLocaleLowerCase();
          messageSearchResults.forEach((result) =&gt; {
            const haystack = (result.dataset.searchText || result.textContent || &#x27;&#x27;).toLocaleLowerCase();
            result.hidden = Boolean(query) &amp;&amp; !haystack.includes(query);
          });
        });
      }

      messageSearchResults.forEach((result) =&gt; result.addEventListener(&#x27;click&#x27;, closeDrawers));

      if (loadHistoryButton &amp;&amp; earlierMessage) {
        loadHistoryButton.addEventListener(&#x27;click&#x27;, () =&gt; {
          earlierMessage.classList.add(&#x27;is-visible&#x27;);
          loadHistoryButton.textContent = &#x27;已加载更早记录 · 滚动位置已保持&#x27;;
          loadHistoryButton.disabled = true;
        });
      }

      const renderAttachments = (files) =&gt; {
        if (!attachmentChips || !files.length) return;
        attachmentChips.hidden = false;
        files.forEach((file) =&gt; {
          const chip = document.createElement(&#x27;span&#x27;);
          chip.className = &#x27;cy-attachment-chip&#x27;;
          chip.dataset.fileName = file.name;
          const label = document.createElement(&#x27;span&#x27;);
          label.textContent = `${file.name} · ${Math.max(1, Math.round(file.size / 1024))} KB`;
          const remove = document.createElement(&#x27;button&#x27;);
          remove.className = &#x27;cy-attachment-remove&#x27;;
          remove.type = &#x27;button&#x27;;
          remove.setAttribute(&#x27;aria-label&#x27;, `移除附件 ${file.name}`);
          remove.textContent = &#x27;×&#x27;;
          remove.addEventListener(&#x27;click&#x27;, () =&gt; {
            chip.remove();
            if (!attachmentChips.children.length) attachmentChips.hidden = true;
          });
          chip.append(label, remove);
          attachmentChips.appendChild(chip);
        });
      };

      if (openStickers &amp;&amp; stickerPanel) {
        openStickers.addEventListener(&#x27;click&#x27;, () =&gt; {
          const willOpen = stickerPanel.hidden;
          stickerPanel.hidden = !willOpen;
          openStickers.setAttribute(&#x27;aria-pressed&#x27;, String(willOpen));
        });
      }

      stickerTabs.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const name = button.dataset.stickerTab || &#x27;emoji&#x27;;
          stickerTabs.forEach((item) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button)));
          stickerPanels.forEach((panel) =&gt; { panel.hidden = panel.dataset.stickerPanel !== name; });
        });
      });

      emojiChoices.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          if (input) {
            input.value += button.dataset.emoji || &#x27;&#x27;;
            input.focus();
          }
        });
      });

      stickerChoices.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const name = button.dataset.stickerName || &#x27;收藏表情&#x27;;
          renderAttachments([{ name: `${name}.webp`, size: 48 * 1024 }]);
          if (stickerPanel) stickerPanel.hidden = true;
          if (openStickers) openStickers.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
          if (input) input.focus();
        });
      });

      if (holdDictation) {
        let dictating = false;
        const startDictation = (event) =&gt; {
          if (dictating) return;
          if (dictationSetting &amp;&amp; !dictationSetting.checked) return;
          event.preventDefault();
          dictating = true;
          holdDictation.classList.add(&#x27;cy-dictating&#x27;);
          holdDictation.setAttribute(&#x27;aria-pressed&#x27;, &#x27;true&#x27;);
          if (input) input.placeholder = &#x27;正在听写…松开后文字会写入输入框&#x27;;
          if (liveStatus) liveStatus.innerHTML = &#x27;&lt;strong&gt;正在听写&lt;/strong&gt;&lt;br&gt;&lt;small&gt;语音只用于生成输入框文字&lt;/small&gt;&#x27;;
        };
        const finishDictation = (event) =&gt; {
          if (!dictating) return;
          event.preventDefault();
          dictating = false;
          holdDictation.classList.remove(&#x27;cy-dictating&#x27;);
          holdDictation.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
          if (input) {
            input.value += `${input.value ? &#x27; &#x27; : &#x27;&#x27;}把输入法转写功能放到设置里，并且不要自动发送。`;

        };
        holdDictation.addEventListener(&#x27;pointerdown&#x27;, startDictation);
        holdDictation.addEventListener(&#x27;pointerup&#x27;, finishDictation);
        holdDictation.addEventListener(&#x27;pointercancel&#x27;, finishDictation);
        holdDictation.addEventListener(&#x27;keydown&#x27;, (event) =&gt; { if (event.key === &#x27; &#x27; || event.key === &#x27;Enter&#x27;) startDictation(event); });
        holdDictation.addEventListener(&#x27;keyup&#x27;, (event) =&gt; { if (event.key === &#x27; &#x27; || event.key === &#x27;Enter&#x27;) finishDictation(event); });
      }

      if (addFileButton &amp;&amp; fileInput) addFileButton.addEventListener(&#x27;click&#x27;, () =&gt; fileInput.click());
      if (fileInput) {
        fileInput.addEventListener(&#x27;change&#x27;, () =&gt; {
          renderAttachments(Array.from(fileInput.files || []));

      if (chatView) {
        let dragDepth = 0;
        chatView.addEventListener(&#x27;dragenter&#x27;, (event) =&gt; {
          if (!event.dataTransfer || !Array.from(event.dataTransfer.types).includes(&#x27;Files&#x27;)) return;

          if (prototypeStatus) {

      if (fontRange) {

      const sendMessage = () =&gt; {

          ? Array.from(attachmentChips.querySelectorAll(&#x27;[data-file-name]&#x27;)).map((item) =&gt; item.dataset.fileName || &#x27;附件&#x27;)

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;

    window.FloatingUIDOM;

  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

              `${Math.max(0, availableHeight)}px`,
            );

      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {

        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;

      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {

        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();

    floating.style.visibility = &quot;hidden&quot;;

    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);

  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
